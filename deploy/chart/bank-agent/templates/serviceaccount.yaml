{{- if .Values.serviceAccount.create }}
# [OPS] RBAC, least privilege: a dedicated ServiceAccount bound to no Role = zero API permissions, and no token mounted
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bank-agent.serviceAccountName" . }}
  labels:
    {{- include "bank-agent.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
