{{- if .Values.rag.enabled }}
# [OPS] nightly freshness run. Same job, on a schedule. One at a time, and a history you can read with kubectl.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "bank-agent.fullname" . }}-ingest
  labels:
    {{- include "bank-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
spec:
  schedule: {{ .Values.rag.ingest.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "bank-agent.name" . }}-ingest
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: ingest
        spec:
          {{- include "bank-agent.ingestPodSpec" . | nindent 10 }}
{{- end }}
