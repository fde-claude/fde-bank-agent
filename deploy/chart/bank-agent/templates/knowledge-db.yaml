{{- if .Values.knowledgeDb.enabled }}
# [OPS] Step 13: Postgres + pgvector for the RAG index. Separate from the gateway's database on purpose: this is derived
#       data (rebuildable from knowledge/ by the ingest Job), so its backup story is "re-run ingest", not "restore".
#       Runs under the namespace's "restricted" Pod Security profile: non-root (the debian postgres uid 999), read-only
#       root filesystem with scratch mounts, no capabilities.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bank-agent.fullname" . }}-knowledge-db
  labels:
    {{- include "bank-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "bank-agent.name" . }}-knowledge-db
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bank-agent.fullname" . }}-knowledge-db
  labels:
    {{- include "bank-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-db
spec:
  serviceName: {{ include "bank-agent.fullname" . }}-knowledge-db
  replicas: 1
  # [OPS] distinct name label: the app's Service, PDB and Deployment select app.kubernetes.io/name=bank-agent and must
  #       never match this pod (a PDB over a single database pod would block every node drain)
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bank-agent.name" . }}-knowledge-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bank-agent.name" . }}-knowledge-db
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: knowledge-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.knowledgeDb.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: knowledge
            - name: POSTGRES_DB
              value: knowledge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.knowledgeDb.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.knowledgeDb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "knowledge", "-d", "knowledge"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "knowledge", "-d", "knowledge"]
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.knowledgeDb.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.knowledgeDb.storage }}
{{- end }}
