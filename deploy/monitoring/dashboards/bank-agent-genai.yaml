data:
  bank-agent-genai.json: "{\n  \"title\": \"bank-agent \\u00b7 GenAI service\",\n  \"uid\": \"bank-agent-genai\",\n  \"tags\": [\n    \"bank-agent\",\n    \"genai\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"editable\": true,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"DS\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"label\": \"Prometheus\",\n        \"current\": {}\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"stat\",\n      \"title\": \"Requests / s (/chat)\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"bank-agent\\\",path=\\\"/chat\\\"}[1m]))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      }\n    },\n    {\n      \"id\": 2,\n      \"type\": \"stat\",\n      \"title\": \"p95 latency (/chat)\",\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\\\"bank-agent\\\",path=\\\"/chat\\\"}[5m])) by (le))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"description\": \"Edge read timeout is 180 s\"\n    },\n    {\n      \"id\": 3,\n      \"type\": \"stat\",\n      \"title\": \"Error ratio (5xx)\",\n      \"gridPos\": {\n        \"x\": 16,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 6\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(http_requests_total{namespace=\\\"bank-agent\\\",path=\\\"/chat\\\",status=~\\\"5..\\\"}[5m])) / sum(rate(http_requests_total{namespace=\\\"bank-agent\\\",path=\\\"/chat\\\"}[5m]))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"max\": 1,\n          \"min\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      }\n    },\n    {\n      \"id\": 4,\n      \"type\": \"timeseries\",\n      \"title\": \"In flight vs ready replicas\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(http_requests_in_flight{namespace=\\\"bank-agent\\\",path=\\\"/chat\\\"})\",\n          \"legendFormat\": \"in flight\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"kube_deployment_status_replicas_ready{namespace=\\\"bank-agent\\\",deployment=\\\"bank-agent\\\"}\",\n          \"legendFormat\": \"ready replicas\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {},\n      \"description\": \"KEDA scales on in-flight / pod\"\n    },\n    {\n      \"id\": 5,\n      \"type\": \"timeseries\",\n      \"title\": \"Model calls / s by stop reason\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (stop_reason) (rate(agent_model_calls_total{namespace=\\\"bank-agent\\\"}[5m]))\",\n          \"legendFormat\": \"{{stop_reason}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {},\n      \"description\": \"tool_use = the agent is working; max_tokens = output ceiling hit\"\n    },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\",\n      \"title\": \"Tokens / min by kind\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 13,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (kind) (rate(agent_tokens_total{namespace=\\\"bank-agent\\\"}[5m])) * 60\",\n          \"legendFormat\": \"{{kind}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"id\": 7,\n      \"type\": \"stat\",\n      \"title\": \"Prompt cache hit ratio\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 13,\n        \"w\": 6,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(agent_tokens_total{namespace=\\\"bank-agent\\\",kind=\\\"cache_read\\\"}[10m])) / sum(rate(agent_tokens_total{namespace=\\\"bank-agent\\\",kind=~\\\"input|cache_read|cache_creation\\\"}[10m]))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"max\": 1,\n          \"min\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"description\": \"Share of prompt tokens served from the provider cache\"\n    },\n    {\n      \"id\": 8,\n      \"type\": \"stat\",\n      \"title\": \"Turns per request (p95)\",\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 13,\n        \"w\": 6,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum(rate(agent_turns_per_request_bucket{namespace=\\\"bank-agent\\\"}[10m])) by (le))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"description\": \"MAX_TURNS is 5\"\n    },\n    {\n      \"id\": 9,\n      \"type\": \"timeseries\",\n      \"title\": \"Tool calls / s by tool and outcome\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 20,\n        \"w\": 12,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum by (tool, is_error) (rate(agent_tool_calls_total{namespace=\\\"bank-agent\\\"}[5m]))\",\n          \"legendFormat\": \"{{tool}} error={{is_error}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {}\n    },\n    {\n      \"id\": 10,\n      \"type\": \"stat\",\n      \"title\": \"Knowledge-base low-confidence rate\",\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 20,\n        \"w\": 6,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(agent_rag_searches_total{namespace=\\\"bank-agent\\\",low_confidence=\\\"true\\\"}[30m])) / sum(rate(agent_rag_searches_total{namespace=\\\"bank-agent\\\"}[30m]))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"max\": 1,\n          \"min\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"description\": \"Rising = the documents have a gap\"\n    },\n    {\n      \"id\": 11,\n      \"type\": \"\
    stat\",\n      \"title\": \"Loop-guard trips (1h)\",\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 20,\n        \"w\": 6,\n        \"h\": 7\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${DS}\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(increase(agent_loop_guard_total{namespace=\\\"bank-agent\\\"}[1h]))\",\n          \"legendFormat\": \"__auto\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ]\n        },\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\"\n      },\n      \"description\": \"Should be zero\"\n    }\n  ]\n}"
