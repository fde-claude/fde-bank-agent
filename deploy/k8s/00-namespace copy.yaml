# deploy/k8s/00-namespace.yaml
# [OPS] One namespace per application. RBAC, quotas, NetworkPolicies and Pod Security all scope to it.
apiVersion: v1
kind: Namespace
metadata:
  name: bank-agent
  labels:
    app.kubernetes.io/name: bank-agent
    # [OPS] Pod Security Admission, "restricted" profile. The API server REJECTS any pod in this namespace
    #       that runs as root, allows privilege escalation, keeps Linux capabilities or lacks a seccomp profile.
    #       Our Deployment satisfies all of it. Anything sloppy is bounced at admission, before it ever runs.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
